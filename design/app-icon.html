<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Play/Past app icon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #222; }
    body { display: grid; min-height: 100vh; place-items: center; }
    .icon {
      width: 512px;
      height: 512px;
      display: grid;
      place-items: center;
      background: #0d0f0e;
      color: #a8e063;
      font-family: Georgia, "Times New Roman", serif;
      position: relative;
      overflow: hidden;
    }
    .icon::before {
      content: "";
      position: absolute;
      inset: 26px;
      border: 2px solid #343a33;
    }
    .mark {
      position: relative;
      z-index: 1;
      font-size: 330px;
      line-height: 1;
      letter-spacing: -0.08em;
    }
  </style>
</head>
<body>
  <div class="icon" aria-label="Play/Past icon">
    <span class="mark">P</span>
  </div>
</body>
</html>
